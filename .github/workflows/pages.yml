# Builds the website in site/ (Hugo, plus the API reference generated from
# the packages' doc comments) and publishes it to GitHub Pages, with the
# workflow shared by the tinyguest-based tools.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: jespino/tinyguest/.github/workflows/pages.yml@v0.1.0
    permissions:
      contents: read
      pages: write
      id-token: write
