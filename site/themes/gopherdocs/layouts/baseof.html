<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-docs{{ end }}">
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
{{ with resources.Get "js/main.js" | minify | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{ end }}
</body>
</html>
